<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenMate B02 — 时序曲线</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; padding: 24px; }
  h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; color: #94a3b8; }

  .controls {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    margin-bottom: 20px; background: #1e293b; padding: 12px 16px;
    border-radius: 8px; border: 1px solid #334155;
  }
  .controls label { font-size: 0.85rem; color: #94a3b8; }
  .controls input[type="datetime-local"] {
    background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
    border-radius: 4px; padding: 4px 8px; font-size: 0.85rem;
  }
  .controls button {
    background: #3b82f6; color: white; border: none; border-radius: 4px;
    padding: 6px 14px; cursor: pointer; font-size: 0.85rem;
  }
  .controls button:hover { background: #2563eb; }
  .controls button:active { background: #1d4ed8; }

  .stats-bar {
    display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 16px;
    font-size: 0.85rem; color: #94a3b8;
  }
  .stat { display: flex; gap: 6px; align-items: center; }
  .stat .val { color: #e2e8f0; font-weight: 500; }
  .stat .unit { color: #64748b; }

  .chart-wrap { background: #1e293b; border-radius: 8px; border: 1px solid #334155; padding: 16px; margin-bottom: 16px; }
  .chart-wrap h2 { font-size: 0.9rem; color: #64748b; margin-bottom: 12px; font-weight: 400; }
  canvas { display: block; width: 100% !important; }

  .error { background: #1e293b; border: 1px solid #ef4444; border-radius: 8px; padding: 16px; color: #fca5a5; }
  .loading { color: #64748b; font-size: 0.85rem; margin-bottom: 8px; }
</style>
</head>
<body>

<h1>GreenMate B02 — 环境时序曲线（7天模拟数据）</h1>

<div class="controls">
  <label>起始时间<input type="datetime-local" id="start-input"></label>
  <label>结束时间<input type="datetime-local" id="end-input"></label>
  <button id="query-btn">查询</button>
  <button id="last-1d">近1天</button>
  <button id="last-3d">近3天</button>
  <button id="last-7d">近7天</button>
  <span id="status-text" style="font-size:0.8rem;color:#64748b;margin-left:auto"></span>
</div>

<div class="stats-bar" id="stats-bar"></div>

<div class="chart-wrap">
  <h2>温度（°C）</h2>
  <canvas id="chart-temp"></canvas>
</div>

<div class="chart-wrap">
  <h2>湿度（%）</h2>
  <canvas id="chart-humid"></canvas>
</div>

<div class="chart-wrap">
  <h2>光照（lux）</h2>
  <canvas id="chart-lux"></canvas>
</div>

<script>
const $ = (id) => document.getElementById(id);

let chartTemp, chartHumid, chartLux;
let currentStart = null, currentEnd = null;

function fmt(dt) { return dt.toISOString().slice(0, 16); }

function setInputs(start, end) {
  $('start-input').value = fmt(new Date(start));
  $('end-input').value   = fmt(new Date(end));
}

async function api(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
  return r.json();
}

function scenarioColor(scenario) {
  return {
    normal:   'rgba(148,163,184,0.8)',
    heat_wave:'rgba(239,68,68,0.7)',
    drought:  'rgba(249,115,22,0.7)',
    shade:    'rgba(132,204,22,0.7)',
    cold_snap:'rgba(56,189,248,0.7)',
    flood:    'rgba(14,165,233,0.7)',
  }[scenario] || 'rgba(148,163,184,0.5)';
}

function renderStats(stats) {
  const bar = $('stats-bar');
  bar.innerHTML = `
    <div class="stat"><span>样本数</span><span class="val">${stats.count}</span></div>
    <div class="stat"><span>温度</span><span class="val">${stats.temperature.min} ~ ${stats.temperature.max}</span><span class="unit">°C</span><span class="unit">均值 ${stats.temperature.mean}°C</span></div>
    <div class="stat"><span>湿度</span><span class="val">${stats.humidity.min} ~ ${stats.humidity.max}</span><span class="unit">%</span><span class="unit">均值 ${stats.humidity.mean}%</span></div>
    <div class="stat"><span>光照</span><span class="val">${Math.round(stats.lux.min)} ~ ${Math.round(stats.lux.max)}</span><span class="unit">lux</span></div>
    <div class="stat"><span>趋势</span><span class="val">${{rising:'↗ 上升',falling:'↘ 下降',stable:'→ 平稳',mixed:'↷ 波动'}[stats.trend]||stats.trend}</span></div>
    <div class="stat"><span>场景</span><span class="val">${Object.entries(stats.scenario_counts||{}).map(([k,v])=>k+':'+v).join('  ')}</span></div>
  `;
}

function makeChartConfig(label, color) {
  return {
    type: 'line',
    data: {
      datasets: [{
        label,
        borderColor: color,
        backgroundColor: color.replace('0.7','0.1').replace('0.8','0.1'),
        borderWidth: 1.5,
        pointRadius: 1.5,
        pointHoverRadius: 4,
        tension: 0.2,
        data: [],
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 2.5,
      animation: { duration: 300 },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => {
              const d = items[0];
              return `${d.label}  场景: ${d.raw.scenario || '?'}`;
            },
            label: (item) => `${item.dataset.label}: ${item.formattedValue}`,
          }
        }
      },
      scales: {
        x: {
          type: 'category',
          ticks: { color: '#64748b', maxTicksLimit: 12, font: { size: 10 } },
          grid: { color: '#1e293b' },
          title: { display: false },
        },
        y: {
          ticks: { color: '#64748b', font: { size: 11 } },
          grid: { color: '#1e293b' },
        }
      }
    }
  };
}

function initCharts() {
  chartTemp  = new Chart($('chart-temp'),  makeChartConfig('温度 (°C)', 'rgba(239,68,68,0.8)'));
  chartHumid = new Chart($('chart-humid'), makeChartConfig('湿度 (%)',  'rgba(56,189,248,0.8)'));
  chartLux   = new Chart($('chart-lux'),   makeChartConfig('光照 (lux)', 'rgba(253,230,138,0.8)'));
}

function loadData(start, end) {
  $('status-text').textContent = '加载中…';
  api(`/api/timeseries?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`)
    .then(data => {
      const labels = data.series.map(p => {
        const d = new Date(p.t);
        return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      });

      function bgColors(series, key) {
        return series.map(p => {
          const a = scenarioColor(p.scenario);
          return a.replace(/[\d.]+\)$/, '0.25)');
        });
      }

      [chartTemp, chartHumid, chartLux].forEach((ch, i) => {
        const keys = ['temp','humid','lux'];
        const key = keys[i];
        ch.data.labels = labels;
        ch.data.datasets[0].data = data.series.map(p => ({x: p.t, y: p[key], scenario: p.scenario}));
        ch.data.datasets[0].backgroundColor = bgColors(data.series, key);
        ch.update();
      });

      $('status-text').textContent = `${data.count} 个样本`;
      currentStart = start; currentEnd = end;
      return api(`/api/stats?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
    })
    .then(stats => renderStats(stats))
    .catch(err => {
      $('status-text').textContent = '加载失败: ' + err.message;
    });
}

async function init() {
  initCharts();
  const status = await api('/api/status');
  if (!status.has_data) {
    $('status-text').textContent = '数据库为空，请先调用 POST /api/generate';
    return;
  }
  const end = status.current.t;
  const start = new Date(new Date(end) - 3*86400000).toISOString();
  setInputs(start, end);
  loadData(start, end);
}

$('query-btn').addEventListener('click', () => {
  const s = $('start-input').value;
  const e = $('end-input').value;
  if (!s || !e) return;
  loadData(new Date(s).toISOString(), new Date(e).toISOString());
});

['last-1d','last-3d','last-7d'].forEach((id, i) => {
  const days = [1,3,7][i];
  $(id).addEventListener('click', () => {
    if (!currentEnd) return;
    const end = new Date(currentEnd);
    const start = new Date(end - days * 86400000).toISOString();
    setInputs(start, end);
    loadData(start, end);
  });
});

init();
</script>
</body>
</html>
