name: B07 invariant tests

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧运行直接取消，别排队等
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # 按 requirements.txt 的哈希缓存 pip 下载缓存，
          # 依赖没变时后续运行只花十几秒
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # B02/greenmate.db 与 B06/artifacts/ 不在版本库里，
      # 用固定 seed 确定性重建（详见 .github/scripts/prepare_fixtures.py）
      - name: Rebuild deterministic fixtures
        run: python .github/scripts/prepare_fixtures.py

      # 把两条 deselect 的理由同时打进日志和 Run Summary：
      # CI 日志里看到 "2 deselected" 的人应该能当场明白为什么跳过是对的，
      # 而不是以为测试漏跑了。
      - name: Explain deselected tests
        run: |
          cat <<'EOF'
          ============================================================
          本次只跳过下面 2 条测试（deselect），其余全部执行。
          两条都不是代码回归，而是"断言里写进了作者本机状态"：

          1) test_model_fingerprints_match_real_files
             基线记录的是 B06 模型文件清单的 sha256，清单里含保存时间
             saved_at。CI 重建模型时 saved_at 是本次构建的墙钟时间，
             与冻结时必然不同 —— 这是环境指纹，不是代码问题。

          2) test_dirty_flag_is_real
             基线是在作者工作区**脏**的时候冻结的（dirty=True）；
             CI 是干净检出（dirty=False），两边不可能相等。
             冻结记录本身不改，这里只跳过这条本机状态断言。

          其余测试（含 S1~S5 的 source_run_sha256 校验）全部真实执行。
          ============================================================
          EOF
          {
            echo "## 本次跳过的 2 条测试"
            echo ""
            echo "| 测试 | 跳过原因 |"
            echo "| --- | --- |"
            echo "| \`test_model_fingerprints_match_real_files\` | 模型清单含 \`saved_at\`（保存时刻），CI 重建时必然不同，属环境指纹 |"
            echo "| \`test_dirty_flag_is_real\` | 基线冻结时工作区是脏的（\`dirty=True\`），CI 干净检出为 \`False\`，不可能相等 |"
            echo ""
            echo "两条都依赖作者本机状态，不是代码回归；其余测试全部执行。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 两条被 deselect 的测试都依赖"作者本机"状态，干净的 CI 检出无法满足：
      #   - test_model_fingerprints_match_real_files：模型清单含 saved_at（墙钟时间）
      #   - test_dirty_flag_is_real：基线冻结时工作区是脏的，CI 检出是干净的
      # 冻结产物（sha256 / dirty）一律不改，只在 CI 里跳过这两条本机状态断言。
      # 行尾问题不在这里规避：仓库根目录的 .gitattributes 已把
      # B07/runs/**/*.json 固定为 CRLF 检出，S1~S5 的哈希校验必须真实通过。
      - name: Run B07 invariant tests
        run: >
          python -m pytest B07/tests -q
          --deselect B07/tests/test_b08_freeze.py::test_model_fingerprints_match_real_files
          --deselect B07/tests/test_b08_freeze.py::test_dirty_flag_is_real
